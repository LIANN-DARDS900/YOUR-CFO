<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your CFO</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="main" style="margin-left:0;width:100%;max-width:900px;margin:auto;padding-top:80px;">
    <div class="card">
      <div class="logo">Your <span>CFO</span></div>

      <h1 style="font-size:42px;margin-bottom:12px;">
        Your personal financial decision assistant.
      </h1>

      <p style="color:#6b7280;font-size:18px;line-height:1.7;">
        Track daily expenses, manage fixed bills, create budget envelopes,
        detect lifestyle creep, and ask Your CFO before buying something.
      </p>

      <div class="actions">
        <button class="btn btn-primary" onclick="startApp()">Start Your CFO</button>
        <button class="btn" onclick="location.href='dashboard.html'">Go to Dashboard</button>
      </div>
    </div>
  </main>

  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>

  <script>
    function startApp() {
      const data = CFOStorage.load();

      if (data.profile) {
        location.href = "dashboard.html";
      } else {
        location.href = "onboarding.html";
      }
    }
  </script>
</body>
</html>
